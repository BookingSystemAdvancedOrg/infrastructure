AWSTemplateFormatVersion: "2010-09-09"
Description: Booqy phone agent test line - the Swedish Lex V2 bot that passes every utterance to Booqy (dev only)
Parameters:
  BotName:
    Type: String
  LexRoleArn:
    Type: String
  RelayArn:
    Type: String
  InstanceArn:
    Type: String
Resources:
  Bot:
    Type: AWS::Lex::Bot
    Properties:
      Name: !Ref BotName
      Description: Speech in Swedish to text for the Booqy phone agent; every turn goes to the code hook
      RoleArn: !Ref LexRoleArn
      DataPrivacy:
        ChildDirected: false
      IdleSessionTTLInSeconds: 600
      AutoBuildBotLocales: true
      BotLocales:
        - LocaleId: sv_SE
          NluConfidenceThreshold: 0.40
          VoiceSettings:
            VoiceId: Elin
            Engine: neural
          Intents:
            - Name: Samtal
              Description: Anything the caller says; Booqy's agent decides what it means
              SampleUtterances:
                - Utterance: hej
                - Utterance: jag vill boka ett bord
                - Utterance: har ni ett bord för fyra imorgon
                - Utterance: vad har ni på menyn
                - Utterance: har ni något vegetariskt
                - Utterance: när har ni öppet
                - Utterance: ja
                - Utterance: nej
                - Utterance: klockan sju
                - Utterance: jag heter Anna
                - Utterance: tack
                - Utterance: hello I would like to book a table
              # No dialog hook: every utterance goes straight to fulfillment,
              # the only step where Lex can speak while it waits.
              DialogCodeHook:
                Enabled: false
              FulfillmentCodeHook:
                Enabled: true
                IsActive: true
                # While Booqy thinks (the whole agent turn runs here), Lex says
                # a short Swedish line after 1 s, and another every 5 s, so the
                # caller never sits in silence (owner 2026-11-18).
                FulfillmentUpdatesSpecification:
                  Active: true
                  TimeoutInSeconds: 30
                  StartResponse:
                    DelayInSeconds: 1
                    AllowInterrupt: false
                    MessageGroups:
                      - Message:
                          PlainTextMessage:
                            Value: Ett ögonblick, jag kollar.
                        Variations:
                          - PlainTextMessage:
                              Value: Absolut, jag tittar på det.
                          - PlainTextMessage:
                              Value: Jag kollar det direkt.
                  UpdateResponse:
                    FrequencyInSeconds: 5
                    AllowInterrupt: false
                    MessageGroups:
                      - Message:
                          PlainTextMessage:
                            Value: Jag letar fortfarande, tack för att du väntar.
            - Name: FallbackIntent
              Description: Everything else, to the same code hook
              ParentIntentSignature: AMAZON.FallbackIntent
              # No dialog hook: every utterance goes straight to fulfillment,
              # the only step where Lex can speak while it waits.
              DialogCodeHook:
                Enabled: false
              FulfillmentCodeHook:
                Enabled: true
                IsActive: true
                # While Booqy thinks (the whole agent turn runs here), Lex says
                # a short Swedish line after 1 s, and another every 5 s, so the
                # caller never sits in silence (owner 2026-11-18).
                FulfillmentUpdatesSpecification:
                  Active: true
                  TimeoutInSeconds: 30
                  StartResponse:
                    DelayInSeconds: 1
                    AllowInterrupt: false
                    MessageGroups:
                      - Message:
                          PlainTextMessage:
                            Value: Ett ögonblick, jag kollar.
                        Variations:
                          - PlainTextMessage:
                              Value: Absolut, jag tittar på det.
                          - PlainTextMessage:
                              Value: Jag kollar det direkt.
                  UpdateResponse:
                    FrequencyInSeconds: 5
                    AllowInterrupt: false
                    MessageGroups:
                      - Message:
                          PlainTextMessage:
                            Value: Jag letar fortfarande, tack för att du väntar.
  # A new logical id makes CloudFormation build a new version from the
  # changed DRAFT (an unchanged BotVersion would keep the old bot behaviour).
  BotVersionFiller:
    Type: AWS::Lex::BotVersion
    Properties:
      BotId: !Ref Bot
      Description: Fulfillment updates (filler while Booqy thinks)
      BotVersionLocaleSpecification:
        - LocaleId: sv_SE
          BotVersionLocaleDetails:
            SourceBotVersion: DRAFT
  Alias:
    Type: AWS::Lex::BotAlias
    Properties:
      BotId: !Ref Bot
      BotAliasName: live
      BotVersion: !GetAtt BotVersionFiller.BotVersion
      BotAliasLocaleSettings:
        - LocaleId: sv_SE
          BotAliasLocaleSetting:
            Enabled: true
            CodeHookSpecification:
              LambdaCodeHook:
                LambdaArn: !Ref RelayArn
                CodeHookInterfaceVersion: "1.0"
  ConnectAssociation:
    Type: AWS::Connect::IntegrationAssociation
    Properties:
      InstanceId: !Ref InstanceArn
      IntegrationType: LEX_BOT
      IntegrationArn: !GetAtt Alias.Arn
Outputs:
  AliasArn:
    Value: !GetAtt Alias.Arn
