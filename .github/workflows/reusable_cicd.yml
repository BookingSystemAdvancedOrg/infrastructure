name: Terraform Reusable

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string

jobs:
  terraform:
    runs-on: ubuntu-24.04
    # Deploys (push to dev/main) run in the GitHub environment named like the
    # target - "prod" has required reviewers, so nothing reaches prod without
    # an approval. The environment also puts ":environment:<env>" in the OIDC
    # token's sub, which the AWS deploy roles can trust. PR runs (tests /
    # plan only) use no environment, so they never wait for approval.
    environment: ${{ github.event_name == 'push' && inputs.environment || '' }}
    # Never two applies of one environment at once; a queued one waits.
    concurrency:
      group: ${{ github.event_name == 'push' && format('terraform-{0}', inputs.environment) || github.run_id }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Load shared project config
        run: |
          grep -v '^#' .github/config/project.env \
            | grep -v '^[[:space:]]*$' \
            | sed -e $'s/\r$//' -e 's/="\(.*\)"$/=\1/' \
            >> "$GITHUB_ENV"

      - name: Export Terraform variables
        # Terraform reads any TF_VAR_<name> env var automatically and maps
        # it to var.<name> - this is what lets `terraform plan`/`apply`
        # below pick up these values with no -var/-var-file needed for them.
        run: |
          echo "TF_VAR_aws_region=${{ env.AWS_REGION }}" >> "$GITHUB_ENV"
          echo "TF_VAR_no_reply_email_address=${{ env.NO_REPLY_EMAIL_ADDRESS }}" >> "$GITHUB_ENV"
          echo "TF_VAR_stripe_api_version=${{ env.STRIPE_API_VERSION }}" >> "$GITHUB_ENV"
          echo "TF_VAR_github_org=${{ env.GITHUB_ORG }}" >> "$GITHUB_ENV"
          echo "TF_VAR_customer_frontend_repo=${{ env.CUSTOMER_FRONTEND_REPO }}" >> "$GITHUB_ENV"
          echo "TF_VAR_admin_frontend_repo=${{ env.ADMIN_FRONTEND_REPO }}" >> "$GITHUB_ENV"
          echo "TF_VAR_backend_repo=${{ env.BACKEND_REPO }}" >> "$GITHUB_ENV"
          echo "TF_VAR_platform_admin_frontend_repo=${{ env.PLATFORM_ADMIN_FRONTEND_REPO }}" >> "$GITHUB_ENV"

      - name: Export Stripe secrets
        # Only the API key crosses CI now. The webhook signing secrets
        # (whsec_...) no longer exist as GitHub secrets at all - Terraform
        # creates the webhook endpoints itself (payments/stripe) and stores
        # each endpoint's secret in Secrets Manager for the receiving Lambda.
        run: |
          echo "TF_VAR_stripe_secret_key=${{ inputs.environment == 'prod' && secrets.STRIPE_SECRET_KEY_PROD || secrets.STRIPE_SECRET_KEY_DEV }}" >> "$GITHUB_ENV"

      - name: Unit test infra-owned Lambda code
        # Lambdas whose code ships from THIS repo as zips (not backend
        # images) - the Cognito pre-token-generation trigger runs on every
        # login, so a broken one locks every tenant out. Fail before any
        # Terraform runs.
        run: python3 -m unittest discover -s compute/lambda/pre-token-generation/tests -v

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ inputs.environment == 'prod' && env.OIDC_ROLE_ARN_PROD || env.OIDC_ROLE_ARN_DEV }}
          aws-region: "${{ env.AWS_REGION }}"
          role-session-name: gha-${{ inputs.environment }}-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.14.0"
          terraform_wrapper: true

      - name: Terraform format check
        run: terraform fmt -check -recursive -diff

      - name: Terraform init
        # Separate bucket per environment, picked by name rather than
        # derived by prefixing - dev and prod are different AWS accounts,
        # so these are two entirely different buckets, not a shared base
        # name with a computed prefix.
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ inputs.environment == 'prod' && env.TERRAFORM_STATES_BUCKET_NAME_PROD || env.TERRAFORM_STATES_BUCKET_NAME_DEV }}" \
            -backend-config="key=products/bsa/${{ inputs.environment }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        # Read-only preview - not saved/applied later, since apply below
        # runs its own plan internally (that's what lets it accept -var-file).
        run: terraform plan -input=false -no-color -var-file="${{ inputs.environment }}.tfvars"

      - name: Terraform apply (ECR repositories only)
        # Bootstraps just the ECR repos first. aws_lambda_function with
        # package_type = "Image" fails to CREATE if no image exists yet at
        # the tag it references - so the repos (and a placeholder image in
        # them, pushed by the next step) have to exist before the full
        # apply below tries to create the Lambda functions themselves.
        #
        # The -target list is DERIVED from config.tf (every `module "*_ecr"`
        # block), not hand-maintained - adding a Lambda's ECR module is
        # enough, there is no second list to remember to update here. The
        # guard loop below also fails the build loudly if a *_ecr module is
        # missing from the ecr_repository_urls output in outputs.tf, since
        # the placeholder-image step depends on that map being complete.
        if: github.event_name == 'push'
        run: |
          set -euo pipefail

          mapfile -t ecr_modules < <(grep -oP 'module "\K[a-z0-9_]+_ecr(?=")' config.tf | sort)
          if [ "${#ecr_modules[@]}" -eq 0 ]; then
            echo "::error::no *_ecr modules found in config.tf - derivation grep is broken"
            exit 1
          fi
          echo "bootstrapping ${#ecr_modules[@]} ECR repositories: ${ecr_modules[*]}"

          for m in "${ecr_modules[@]}"; do
            if ! grep -q "module\.${m}\." outputs.tf; then
              echo "::error::module ${m} exists in config.tf but is missing from the ecr_repository_urls output in outputs.tf - add it there so the placeholder-image step can see the new repository"
              exit 1
            fi
          done

          targets=()
          for m in "${ecr_modules[@]}"; do
            targets+=("-target=module.${m}")
          done

          terraform apply -input=false -auto-approve -var-file="${{ inputs.environment }}.tfvars" "${targets[@]}"

      - name: Push placeholder image to any empty ECR repository
        # Only touches repositories that don't already have a ":latest"
        # image - never overwrites whatever the backend repo's own CI/CD
        # has already pushed there. Only matters for a function's first-
        # ever deploy; a no-op on every run after that.
        if: github.event_name == 'push'
        run: |
          set -euo pipefail

          urls_json=$(terraform output -json ecr_repository_urls)
          registry=$(echo "$urls_json" | jq -r 'to_entries[0].value' | cut -d/ -f1)

          aws ecr get-login-password --region "${{ env.AWS_REGION }}" \
            | docker login --username AWS --password-stdin "$registry"

          docker build -t placeholder:latest ci/placeholder-lambda

          echo "$urls_json" | jq -r 'to_entries[] | "\(.key)=\(.value)"' | while IFS='=' read -r name url; do
            repo_name="${url#*/}"
            if aws ecr describe-images --region "${{ env.AWS_REGION }}" \
                 --repository-name "$repo_name" --image-ids imageTag=latest >/dev/null 2>&1; then
              echo "skip $repo_name - already has a :latest image"
              continue
            fi
            echo "pushing placeholder to $repo_name"
            docker tag placeholder:latest "$url:latest"
            docker push "$url:latest"
          done

      - name: Terraform apply
        if: github.event_name == 'push'
        run: terraform apply -input=false -auto-approve -var-file="${{ inputs.environment }}.tfvars"

      - name: Release Lambda configuration changes
        # Terraform publishes a new version when an apply changes a
        # function's configuration (environment variables, memory, timeout,
        # ...) but never moves the "live" alias callers invoke - so such a
        # change is released here exactly like the app repos release code:
        # CodeDeploy canary, automatic rollback on alarm, result emailed.
        # Functions whose configuration didn't change are skipped (no email).
        if: github.event_name == 'push'
        run: |
          set -euo pipefail

          releases=$(terraform output -json lambda_releases)
          app=$(jq -r '.app_name' <<<"$releases")
          topic=$(jq -r '.alert_topic_arn' <<<"$releases")
          mkdir -p release-logs
          : > release-logs/FAILED

          export app topic
          export ENVIRONMENT="${{ inputs.environment }}"
          export SOURCE="infrastructure@${GITHUB_SHA::7} (configuration)"
          jq -r '.deployment_groups | keys[]' <<<"$releases" \
            | xargs -P 8 -I{} bash -c \
                'bash ci/lambda-release.sh --function "$1" --app "$app" --topic "$topic" --environment "$ENVIRONMENT" --source "$SOURCE" \
                   > "release-logs/$1.log" 2>&1 || echo "$1" >> release-logs/FAILED' _ {}

          cat release-logs/*.log
          if [ -s release-logs/FAILED ]; then
            echo "::error::rolled back (still on the previous version): $(tr '\n' ' ' < release-logs/FAILED)"
            exit 1
          fi

      - name: Deploy placeholder front-end (if not already replaced)
        # Confirms the S3 + CloudFront wiring works end-to-end right after
        # infra is applied, before either front-end repo's own CI/CD has
        # ever run. Guarded the same way the placeholder Lambda image step
        # above is guarded: only touches a bucket that's completely empty -
        # any object at all (not just an index.html at the root) counts as
        # "already deployed" - so this never overwrites a real front-end
        # build. Once customer-front-end/admin-front-end's own pipeline
        # deploys here, this step is a permanent no-op for that bucket.
        if: github.event_name == 'push'
        run: |
          set -euo pipefail

          customer_bucket=$(terraform output -raw customer_front_end_bucket_name)
          admin_bucket=$(terraform output -raw admin_front_end_bucket_name)
          platform_admin_bucket=$(terraform output -raw platform_admin_front_end_bucket_name)
          customer_distribution_id=$(terraform output -raw customer_cloudfront_distribution_id)
          admin_distribution_id=$(terraform output -raw admin_cloudfront_distribution_id)
          platform_admin_distribution_id=$(terraform output -raw platform_admin_cloudfront_distribution_id)

          deploy_placeholder() {
            local bucket="$1" src="$2" distribution_id="$3"
            local key_count
            key_count=$(aws s3api list-objects-v2 --bucket "$bucket" --max-keys 1 --output json | jq '.KeyCount // 0')
            if [ "$key_count" -gt 0 ]; then
              echo "skip $bucket - already has content"
              return
            fi
            echo "deploying placeholder to $bucket"
            aws s3 sync "$src" "s3://$bucket" --delete
            aws cloudfront create-invalidation --distribution-id "$distribution_id" --paths "/*" >/dev/null
          }

          deploy_placeholder "$customer_bucket" "ci/placeholder-frontend/customer" "$customer_distribution_id"
          deploy_placeholder "$admin_bucket" "ci/placeholder-frontend/admin" "$admin_distribution_id"
          deploy_placeholder "$platform_admin_bucket" "ci/placeholder-frontend/platform-admin" "$platform_admin_distribution_id"
